name: backend

on:
  pull_request:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e './backend[dev]'
      - run: python --version
      - run: python -m pytest
        working-directory: backend
      - run: python -m ruff check .
        working-directory: backend
      - run: python -m mypy app
        working-directory: backend
