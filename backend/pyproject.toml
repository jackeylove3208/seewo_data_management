[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "organization-reconciliation"
version = "0.1.0"
description = "Organization data reconciliation backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "asyncmy>=0.2,<1",
  "charset-normalizer>=3.4,<4",
  "cryptography>=45,<47",
  "fastapi>=0.115,<1",
  "httpcore>=1,<2",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "polars>=1.20,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pgvector>=0.4,<1",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6,<7",
  "rapidfuzz>=3.12,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.normalization" = ["rules.v1.json"]
"app.ai.skills" = ["*/SKILL.md", "*/agents/*.yaml"]
"app.reports" = ["templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["charset_normalizer.*", "yaml"]
ignore_missing_imports = true
